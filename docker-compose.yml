version: '3.8'

services:
  # Greenmask container that processes dump.sql file
  greenmask:
    build:
      context: .
      dockerfile: Dockerfile.greenmask
    volumes:
      - ./dump:/input          # Input dump.sql mounted here
      - ./output:/output       # Output sanitized.sql.gz
      - ./transformers:/app/transformers
      - ./prompt_templates:/app/prompt_templates
    environment:
      - OFOX_API_KEY=${OFOX_API_KEY}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://api.ofox.ai/v1}
      - LLM_MODEL=${LLM_MODEL:-bailian/qwen3.5-flash}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-100}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
    working_dir: /app
    command: >
      greenmask sanitise \
      --source '/input/dump.sql' \
      --target '/output/sanitized.sql.gz'
    depends_on: []
