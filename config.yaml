# Greenmask configuration for MySQL database sanitization
# 
# ✅ REALISTIC ANONYMIZATION MODE ONLY (no obfuscation)
# All transformations generate real-looking data while preserving:
# - Language/script consistency (Spanish → Spanish, not Russian!)
# - Structural consistency (same area code, similar email format)
# - Entity consistency (same value = same replacement everywhere)
# - Foreign key integrity (all *_id columns preserved automatically)

database:
  type: mysql
  host: ${DB_HOST:-localhost}
  port: 3306
  user: ${DB_USER:-root}
  password: ${DB_PASSWORD:-password}
  database: ${DB_NAME:-test_db}

output:
  storage: local
  path: /output/sanitized.sql.gz
  compression: gzip

# =============================================================================
# PRIMARY KEY PRESERVATION
# =============================================================================
# ALL *_id columns are automatically skipped to preserve FK relationships
# This is CRITICAL for maintaining referential integrity!

transformers:
  
  # =============================================================================
  # CUSTOMERS TABLE - PII fields with REALISTIC anonymization
  # =============================================================================
  - name: customers_transformer
    schema: test_db
    table: customers
    
    skip_columns:
      - customer_id       # ← IMPORTANT! NEVER change PKs
      
    columns:
      # Names → LLM-based language-aware replacement
      first_name:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/name.txt
          llm_model: bailian/qwen3.5-flash
      
      last_name:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/name.txt
          llm_model: bailian/qwen3.5-flash
      
      # Email → Realistic generator (NOT anon@example.com!)
      email:
        transformer: custom_email_generator
        params:
          preserve_domain: false
          # Creates: maria.garcia@gmail.com → pedro.silva@gmail.com
      
      phone:
        transformer: custom_phone_generator
        params:
          # Preserves country/area code: +7-495-123-4567 → +7-495-987-6543
        
      # Address → Street changes but city/country preserved
      address:
        transformer: city_preserving_address_masker
  
  # =============================================================================
  # ORDERS TABLE - References customers via FK
  # =============================================================================
  - name: orders_transformer
    schema: test_db
    table: orders
    
    skip_columns:
      - order_id              # PK
      - customer_id           # FK → AUTO-PRESERVED ✅
    
    columns:
      shipping_address:
        transformer: city_preserving_address_masker
      
      shipping_phone:
        transformer: custom_phone_generator
      
      status:
        transformer: random_select
        params:
          options: ["completed", "pending", "shipped", "cancelled"]
  
  # =============================================================================
  # SYSTEM LOGS TABLE - Technical data & events
  # =============================================================================
  - name: system_logs_transformer
    schema: test_db
    table: system_logs
    
    skip_columns:
      - log_id                # PK
      - user_id               # FK → AUTO-PRESERVED ✅
    
    columns:
      ip_address:
        transformer: ip_anonymize
        params:
          method: hash_last_octet
      
      user_agent:
        transformer: static_replace
        value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0"
    
    timestamp_filters:
      timestamp:
        transformer: timestamp_shift
        params:
          shift_days: -7

# =============================================================================
# MAPPING OUTPUT (optional)
# =============================================================================
mapping:
  output_path: /output/mapping.json
  include_original_values: false
