# Greenmask configuration for MySQL database sanitization
# Custom LLM transformer is used for PII data anonymization

# Database source (not used in dump-based workflow, but required by schema)
database:
  type: mysql
  host: ${DB_HOST:-localhost}
  port: 3306
  user: ${DB_USER:-root}
  password: ${DB_PASSWORD:-password}
  database: ${DB_NAME:-test_db}

# Output settings
output:
  storage: local
  path: /output/sanitized.sql.gz
  compression: gzip

# Transformation rules
transformers:
  # Rules are applied to tables found in the dump
  # Add your tables and columns here
  
  - name: users_transformer
    schema: public
    table: users
    columns:
      first_name:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/name.txt
          llm_model: bailian/qwen3.5-flash
      
      last_name:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/name.txt
          llm_model: bailian/qwen3.5-flash
      
      email:
        transformer: mask_email
        params:
          keep_domain: true
          domain_to_use: anonymized.local
      
      birth_date:
        transformer: date_shift
        params:
          shift_days: -7
  
  - name: orders_transformer  
    schema: public
    table: orders
    columns:
      customer_phone:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/phone.txt
          llm_model: bailian/qwen3.5-flash
      
      shipping_address:
        transformer: static_replace
        value: "141000 г. Мытищи, ул. Заводская д. 1"

# Mapping output (for reverse transformation if needed)
mapping:
  output_path: /output/mapping.json
  include_original_values: false
