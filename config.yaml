# Greenmask configuration for MySQL database sanitization
# Custom LLM transformer is used for PII data anonymization
# ⚠️  LANGUAGE-AGNOSTIC: LLM will preserve original script/encoding (no María → Ярослав!)

database:
  type: mysql
  host: ${DB_HOST:-localhost}
  port: 3306
  user: ${DB_USER:-root}
  password: ${DB_PASSWORD:-password}
  database: ${DB_NAME:-test_db}

output:
  storage: local
  path: /output/sanitized.sql.gz
  compression: gzip

# Transformation rules
transformers:
  
  # CUSTOMERS TABLE - sensitive PII fields
  - name: customers_transformer
    schema: test_db
    table: customers
    columns:
      first_name:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/name.txt
          llm_model: bailian/qwen3.5-flash
      
      last_name:
        transformer: custom_llm_masker
        params:
          prompt_template_file: /app/prompt_templates/name.txt
          llm_model: bailian/qwen3.5-flash
      
      email:
        transformer: mask_email
        params:
          keep_domain: false
          new_prefix: anon
          new_domain: example.com
      
      phone:
        transformer: mask_phone
        params:
          country_code: "+1"
          format: international
  
  # ORDERS TABLE
  - name: orders_transformer
    schema: test_db
    table: orders
    columns:
      shipping_phone:
        transformer: mask_phone
        params:
          country_code: "+1"
          format: international

# Mapping output (for reverse transformation if needed)
mapping:
  output_path: /output/mapping.json
  include_original_values: false
